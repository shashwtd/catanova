name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate authenticated production deployment
        env:
          CATANOVA_DOMAIN: catanova.example
          CATANOVA_REVISION: ${{ github.sha }}
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_configuration_only
          TURNSTILE_SITE_KEY: site_key_for_configuration_validation
        run: docker compose --env-file deploy/single-vm/.env.example -f deploy/single-vm/compose.yaml config --quiet
      - run: docker compose up --build --wait
      - run: npm run probe
      - if: always()
        run: docker compose down -v
