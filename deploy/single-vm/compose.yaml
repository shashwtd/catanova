name: catanova-production

services:
  game:
    # Build a reviewed, detached checkout; the revision also identifies the local image.
    build:
      context: ../..
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.source: https://github.com/shashwtd/catanova
        org.opencontainers.image.revision: ${CATANOVA_REVISION:?Set the full deployed Git commit in .env}
    image: catanova-local:${CATANOVA_REVISION:?Set the full deployed Git commit in .env}
    pull_policy: never
    # SQLite has one authoritative process. Compose must not scale this service.
    container_name: catanova-game
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_PATH: /app/data/probe.sqlite
      REQUIRE_AUTH: 'true'
      ALLOW_LOCAL_PLAYTEST: 'false'
      SUPABASE_URL: ${SUPABASE_URL:?Set the HTTPS Supabase project URL in .env}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set the public Supabase publishable key in .env}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?Set the public production Turnstile site key in .env}
      ALLOWED_ORIGINS: https://${CATANOVA_DOMAIN:?Set one public hostname without scheme or path in .env}
      # Set to this deployment's private Compose subnet; never trust arbitrary forwarded IPs.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      # Optional server-only bot credentials. Empty means deterministic fallback play.
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      CATANOVA_BOT_MODEL: ${CATANOVA_BOT_MODEL:-jev-latest}
      CATANOVA_REVISION: ${CATANOVA_REVISION:?Set the full deployed Git commit in .env}
      # Admin console (docs/ADMIN.md): a second listener on this private network only. The
      # Cloudflare Tunnel below is the one way in, and every request must also carry a Cloudflare
      # Access token for ADMIN_ACCESS_AUD with an email in ADMIN_EMAILS. Never publish ADMIN_PORT.
      ADMIN_PORT: '3100'
      ADMIN_HOST: 0.0.0.0
      ADMIN_AUTH: cloudflare-access
      ADMIN_ACCESS_TEAM_DOMAIN: ${ADMIN_ACCESS_TEAM_DOMAIN:?Set the Cloudflare Zero Trust team domain in .env}
      ADMIN_ACCESS_AUD: ${ADMIN_ACCESS_AUD:?Set the Access application Audience (AUD) tag in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?Set the admin email address or addresses in .env}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:?Set the admin origin, such as https://admin.catanova.io, in .env}
      STATUS_DIR: /app/status
    # Ports 3000 and 3100 are reachable only on the Compose network, never published on the VM.
    volumes:
      - game-data:/app/data
      # Backup and watchdog reports written by the host's scripts, mounted read-only.
      - /srv/catanova/status:/app/status:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: '10m'
        max-file: '3'

  caddy:
    image: caddy:2.11.4-alpine
    depends_on:
      game:
        condition: service_healthy
    environment:
      CATANOVA_DOMAIN: ${CATANOVA_DOMAIN:?Set one public hostname without scheme or path in .env}
    ports:
      - '80:80/tcp'
      - '443:443/tcp'
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: '10m'
        max-file: '3'

  # Dials out to Cloudflare and carries admin.catanova.io to game:3100. Nothing listens on the VM
  # for it: no ports and no inbound firewall rule. The route and the Access policy live in
  # Cloudflare Zero Trust; see docs/ADMIN.md.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set the Cloudflare Tunnel token in .env}
    depends_on:
      game:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: '10m'
        max-file: '3'

configs:
  caddyfile:
    file: ./Caddyfile

# Explicit names preserve storage across checkout-directory and image changes.
volumes:
  game-data:
    name: catanova-game-data
  caddy-data:
    name: catanova-caddy-data
  caddy-config:
    name: catanova-caddy-config
