<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catanova — logo size review</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 24px; background: #0f2028; color: #f6e8c8; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 900px; margin: auto; }
    h1 { font-size: 24px; font-weight: 600; margin: 0 0 8px; }
    p { color: #b4c6c6; margin: 0 0 28px; }
    .hero { display: block; width: min(100%, 400px); height: auto; border-radius: 22%; margin-bottom: 32px; }
    .sizes { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 36px; }
    figure { margin: 0; }
    .sizes img { display: block; border-radius: 22%; }
    figcaption { padding-top: 10px; font-size: 13px; color: #b4c6c6; }
  </style>
  <main>
    <h1>Catanova</h1>
    <p>App-icon concept · original source displayed at each size</p>
    <img class="hero" src="catanova-app-icon-v1.png" width="400" height="400" alt="A gold hexagonal C above green hills and a red settlement roof, with a gold spark." />
    <div class="sizes">
      <figure><img src="catanova-app-icon-v1.png" width="32" height="32" alt="Catanova at 32 pixels" /><figcaption>32 px</figcaption></figure>
      <figure><img src="catanova-app-icon-v1.png" width="48" height="48" alt="Catanova at 48 pixels" /><figcaption>48 px</figcaption></figure>
      <figure><img src="catanova-app-icon-v1.png" width="64" height="64" alt="Catanova at 64 pixels" /><figcaption>64 px</figcaption></figure>
      <figure><img src="catanova-app-icon-v1.png" width="128" height="128" alt="Catanova at 128 pixels" /><figcaption>128 px</figcaption></figure>
    </div>
  </main>
</html>
